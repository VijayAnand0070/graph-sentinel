[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphsentinel"
version = "0.9.0"
description = "Temporal graph detection and evidence-grounded triage for enterprise lateral movement"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "GraphSentinel contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
data = [
  "polars>=1.25,<2",
  "pyarrow>=19,<22",
]
ml = [
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "torch-geometric>=2.6,<3",
]
api = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<1",
]
dashboard = ["streamlit>=1.42,<1.57"]
hub = ["huggingface_hub[hf_xet]>=1.1,<2"]
agent = ["langgraph>=1.0,<2"]
all = ["graphsentinel[data,ml,api]"]
dev = [
  "mypy>=1.15,<2",
  "httpx>=0.27,<0.29",
  "langgraph>=1.0,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
graphsentinel = "graphsentinel.cli:main"
graphsentinel-api = "graphsentinel.api.run:main"
graphsentinel-replay = "graphsentinel.replay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphsentinel"]

[tool.hatch.build.targets.wheel.force-include]
"src/graphsentinel/web" = "graphsentinel/web"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["graphsentinel"]

[tool.coverage.run]
branch = true
source = ["graphsentinel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
